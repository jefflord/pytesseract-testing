<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Font Quadrants Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo&family=Atkinson+Hyperlegible&family=Courier+Prime&family=JetBrains+Mono&display=swap">
<style>
  :root {
    --bg: #f3f5f2; --fg: #1d2a24; --muted: #6b7a72; --line: #cdd5cf; --btn: #1d2a24; --btn-fg: #f3f5f2;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161c19; --fg: #e8eee9; --muted: #8b9a92; --line: #2e3a34; --btn: #e8eee9; --btn-fg: #161c19; }
  }
  :root[data-theme="dark"] { --bg: #161c19; --fg: #e8eee9; --muted: #8b9a92; --line: #2e3a34; --btn: #e8eee9; --btn-fg: #161c19; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .legend { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  button { font: 600 15px system-ui, sans-serif; background: var(--btn); color: var(--btn-fg); border: 0; border-radius: 6px; padding: 10px 18px; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--muted); outline-offset: 2px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .quad { padding: 18px 18px 8px; border: 1px solid var(--line); min-width: 0; }
  .quad h2 { margin: 0; font-size: 22px; }
  .quad .kind { margin: 2px 0 8px; font: 13px system-ui, sans-serif; color: var(--muted); }
  .quad .test { margin: 0 0 8px; font-size: 20px; letter-spacing: 0.08em; }
  .row { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); }
  .size { flex: 0 0 40px; font: 12px system-ui, sans-serif; color: var(--muted); }
  .box { flex: none; box-sizing: border-box; background: var(--line); border: 1px solid var(--muted); }
  .phrase { line-height: 1.15; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Three words at 10–24px, four fonts</h1>
    <button id="btn" type="button">New words</button>
  </header>
  <p class="legend">Left: proportional width. Right: fixed width. Top: more look-alike characters. Bottom: fewer. Every quadrant has its own words, and no word repeats anywhere on the page.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
  const fonts = [
    { name: "Arimo", stack: '"Arimo", Arial, Helvetica, sans-serif', kind: "Proportional · more look-alikes (I, l and 1 are similar)" },
    { name: "Courier Prime", stack: '"Courier Prime", "Courier New", monospace', kind: "Fixed width · more look-alikes (plain 0 and O)" },
    { name: "Atkinson Hyperlegible", stack: '"Atkinson Hyperlegible", Verdana, sans-serif', kind: "Proportional · fewer look-alikes (distinct I, l, 1, 0, O)" },
    { name: "JetBrains Mono", stack: '"JetBrains Mono", Consolas, monospace', kind: "Fixed width · fewer look-alikes (distinct I, l, 1, 0, O)" }
  ];
  const words = ["quiet", "amber", "hollow", "brisk", "velvet", "distant", "clever", "rusty", "gentle", "wild", "frozen", "golden", "sleepy", "bright", "crooked", "harbor", "lantern", "meadow", "engine", "orchard", "compass", "thunder", "pebble", "window", "river", "signal", "carpet", "garden", "falcon", "mirror", "copper", "willow", "ember", "quartz", "drift", "marble", "saddle", "tundra", "whisper", "anchor", "million", "illicit", "rooftop", "violin", "pillar", "lilac", "olive", "tunnel", "cabinet", "morning", "kitchen", "lobby", "balloon", "mountain", "cornet", "noodle", "holiday", "pilot", "library", "iodine", "sailor", "ribbon", "bottle", "camera", "planet", "silver", "basket", "forest", "candle", "blanket", "oyster", "magnet", "pocket", "valley", "thistle", "walnut", "fabric", "glacier", "jungle", "kettle", "lemon", "marlin", "nickel", "orbit", "parcel", "quiver", "raven", "sparrow", "timber", "umber", "vessel", "wagon", "yellow", "zephyr", "bramble", "cinder", "dolphin", "fennel", "granite", "hazel", "ivory", "juniper", "kernel", "linen", "mosaic", "nectar", "opal", "petal", "quill", "rubble", "sorrel", "tassel", "urchin", "velour", "wicker"];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const grid = document.getElementById("grid");
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
  function render() {
    grid.innerHTML = "";
    const w = shuffle(words);
    fonts.forEach((f, fi) => {
      const phrases = [];
      for (let i = 0; i < 8; i++) phrases.push(w.slice((fi * 8 + i) * 3, (fi * 8 + i) * 3 + 3).join(" "));
      const q = el("section", "quad");
      q.style.fontFamily = f.stack;
      q.append(el("h2", "", f.name), el("p", "kind", f.kind), el("p", "test", "Il1| O0o"));
      for (let px = 10, i = 0; px <= 24; px += 2, i++) {
        const r = el("div", "row");
        const b = el("span", "box"); b.style.width = b.style.height = px + "px";
        const p = el("span", "phrase", phrases[i]); p.style.fontSize = px + "px";
        r.append(el("span", "size", px + "px"), b, p);
        q.append(r);
      }
      grid.append(q);
    });
  }
  document.getElementById("btn").addEventListener("click", render);
  render();
</script>
</body>
</html>
