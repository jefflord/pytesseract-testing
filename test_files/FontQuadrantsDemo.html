<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Font and Light/Dark OCR Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo&family=Atkinson+Hyperlegible&family=Courier+Prime&family=JetBrains+Mono&display=swap">
<style>
  :root {
    --page: #f3f5f2;
    --ink: #1d2a24;
    --muted: #627168;
    --rule: #cdd5cf;
    font-family: system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); }
  main { width: 100%; max-width: 3200px; margin: 0 auto; padding: 30px 36px 52px; }
  header { margin-bottom: 8px; }
  h1 { margin: 0; font-size: 22px; font-weight: 650; }
  .legend { margin: 5px 0 18px; color: var(--muted); font-size: 14px; }
  .font-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .font-quad { min-width: 0; padding: 17px; border: 1px solid var(--rule); border-radius: 8px; background: #e8ede9; }
  .font-quad > h2 { margin: 0 0 3px; font-size: 19px; }
  .kind { margin: 0 0 9px; color: var(--muted); font: 12px system-ui, sans-serif; }
  .mode-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .mode {
    min-width: 0;
    padding: 12px 12px 9px;
    border: 1px solid #cdd5cf;
    border-radius: 6px;
    background: #fff;
    color: #1d2a24;
  }
  .mode.dark {
    border-color: #394a43;
    background: #111a16;
    color: #e9f5ec;
  }
  .mode h3 { margin: 0 0 5px; font: 600 12px system-ui, sans-serif; }
  .sample { margin: 0 0 6px; font-size: 15px; letter-spacing: .04em; }
  .row { display: flex; align-items: baseline; gap: 6px; padding: 4px 0; border-top: 1px solid #dce3de; white-space: nowrap; }
  .dark .row { border-color: #394a43; }
  .size { flex: 0 0 25px; color: #627168; font: 9px system-ui, sans-serif; }
  .dark .size { color: #a9c1b2; }
  .phrase { flex: 0 0 auto; line-height: 1.15; white-space: nowrap; }
  .arimo { font-family: Arimo, Arial, Helvetica, sans-serif; }
  .courier { font-family: "Courier Prime", "Courier New", monospace; }
  .atkinson { font-family: "Atkinson Hyperlegible", Verdana, sans-serif; }
  .jetbrains { font-family: "JetBrains Mono", Consolas, monospace; }
  @media (max-width: 2000px) { .font-grid { grid-template-columns: 1fr; } }
  @media (max-width: 1050px) {
    main { padding: 20px 12px 36px; }
    .font-quad { padding: 10px; }
    .mode-pair { grid-template-columns: 1fr; gap: 8px; }
    .mode { padding: 9px 10px 6px; }
    .row { overflow-x: auto; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Fixed OCR phrases · four font quadrants · light and dark side by side · 8–24px</h1>
  </header>
  <p class="legend">Each font quadrant pairs the same fixed phrases in light and dark colors. Rows run from 8px through 24px; no text or phrase positions are randomized.</p>
  <div class="font-grid" id="font-grid" aria-label="Four font quadrants, each with light and dark samples"></div>
</main>
<script>
  const sizes = [8, 10, 12, 14, 16, 18, 20, 22, 24];
  const fonts = [
    {
      id: "arimo", name: "Arimo", className: "arimo",
      kind: "Proportional · similar I, l, and 1",
      sample: "Il1| 0O8o",
      lightPhrases: [
        "quiver cabinet frozen 4827316", "kitchen thistle willow 9152048", "velvet wagon kernel 6371852",
        "ivory violin lilac 2846901", "million pillar valley 7538164", "yellow zephyr pocket 1964370",
        "ribbon glacier gentle 5283047", "sailor silver basket 8416729", "tunnel marlin nickel 3709581"
      ],
      darkPhrases: [
        "cobalt meadow sparrow 6248193", "ginger thimble lantern 3085726", "plucky walnut blossom 9514068",
        "crystal meadow spindle 4720631", "marigold tumble velvet 8163952", "sprightly cedar acorn 2397485",
        "twilight pebble daisy 7051824", "sunbeam orchard fiddle 1836409", "whimsy pocket bracken 5472916"
      ]
    },
    {
      id: "courier_prime", name: "Courier Prime", className: "courier",
      kind: "Fixed width · similar 0 and O",
      sample: "0O8o Il1|",
      lightPhrases: [
        "amber hollow brisk 6042817", "distant clever rusty 2379150", "lantern meadow engine 8963402",
        "orchard compass thunder 4517286", "pebble window river 7280641", "signal carpet garden 3158924",
        "falcon mirror copper 9701365", "willow ember quartz 5834270", "drift marble saddle 1426893"
      ],
      darkPhrases: [
        "foxglove kettle shimmer 3918274", "breezy acrobat plumage 7604318", "cinnamon rocket fern 2185693",
        "puzzling hammock cricket 8452071", "dandelion turnip comet 6301948", "flannel hummingbird biscuit 1729580",
        "sunflower zipper lagoon 5046832", "cucumber labyrinth toast 9872146", "frosty macaroni velvet 3268059"
      ]
    },
    {
      id: "atkinson_hyperlegible", name: "Atkinson Hyperlegible", className: "atkinson",
      kind: "Proportional · distinct I, l, 1, 0, O",
      sample: "Il1| 0O8o",
      lightPhrases: [
        "tundra whisper anchor 8192753", "million illicit rooftop 3604182", "violin pillar olive 7429516",
        "morning balloon mountain 2057839", "cornet noodle holiday 6841327", "pilot library iodine 9315604",
        "camera planet forest 4178295", "candle blanket oyster 5682041", "magnet pocket thistle 2937468"
      ],
      darkPhrases: [
        "lavender hammock orbit 4173602", "raspberry compass flint 8526914", "jovial penguin trinket 2064387",
        "pancake meadow zeppelin 7391052", "whistle acorn sapphire 5812763", "marshmallow tumble reed 9438206",
        "velvet cactus tambourine 1657943", "biscuit thunder daffodil 6284317", "gossamer pickle lantern 3749501"
      ]
    },
    {
      id: "jetbrains_mono", name: "JetBrains Mono", className: "jetbrains",
      kind: "Fixed width · distinct I, l, 1, 0, O",
      sample: "Il1| 0O8o",
      lightPhrases: [
        "walnut fabric jungle 7562184", "kettle lemon marlin 1846372", "orbit parcel quiver 6294051",
        "raven sparrow timber 8431706", "umber vessel wagon 2975318", "bramble cinder dolphin 5108642",
        "fennel granite hazel 9724163", "juniper kernel linen 4350897", "mosaic nectar opal 1683245"
      ],
      darkPhrases: [
        "tangerine cobweb puddle 8157204", "knapsack oatmeal igloo 4623185", "dizzy firefly velvet 9305716",
        "banjo waterfall mitten 2746039", "blueberry orbit whisker 6581942", "marble jellyfish tumble 1038467",
        "peppermint thicket banister 7462951", "kangaroo teacup frost 5290738", "quartz badger ribbon 3816470"
      ]
    }
  ];

  const grid = document.getElementById("font-grid");
  for (const font of fonts) {
    const quadrant = document.createElement("section");
    quadrant.className = "font-quad";
    quadrant.setAttribute("aria-labelledby", `heading-${font.id}`);
    const heading = document.createElement("h2");
    heading.id = `heading-${font.id}`;
    heading.textContent = font.name;
    const kind = document.createElement("p");
    kind.className = "kind";
    kind.textContent = font.kind;
    const pair = document.createElement("div");
    pair.className = "mode-pair";

    for (const modeName of ["light", "dark"]) {
      const phrases = modeName === "light" ? font.lightPhrases : font.darkPhrases;
      const mode = document.createElement("section");
      mode.className = `mode ${font.className}${modeName === "dark" ? " dark" : ""}`;
      mode.setAttribute("aria-label", `${font.name} ${modeName} mode`);
      const modeHeading = document.createElement("h3");
      modeHeading.textContent = `${modeName === "light" ? "Light" : "Dark"} mode`;
      const sample = document.createElement("p");
      sample.className = "sample";
      sample.textContent = font.sample;
      mode.append(modeHeading, sample);

      sizes.forEach((px, index) => {
        const row = document.createElement("div");
        row.className = "row";
        const size = document.createElement("span");
        size.className = "size";
        size.textContent = `${px}px`;
        const phrase = document.createElement("span");
        phrase.className = "phrase";
        phrase.style.fontSize = `${px}px`;
        phrase.textContent = phrases[index];
        phrase.dataset.truthKey = `${font.id}_${modeName}_${px}px`;
        row.append(size, phrase);
        mode.append(row);
      });
      pair.append(mode);
    }
    quadrant.append(heading, kind, pair);
    grid.append(quadrant);
  }
</script>
</body>
</html>
